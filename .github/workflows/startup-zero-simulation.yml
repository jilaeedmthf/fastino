name: Startup-zero digital simulations
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # generate_rtl.py reads the historical v0.2 negative control
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.7'
      - name: Install simulator
        # Runner packages can change; each run records its actual Icarus version.
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Fetch pinned simulation sources
        run: bash offline_tests/fetch_sim_dependencies.sh "$RUNNER_TEMP/fastino-dependencies"
      - name: Run digital checks with explicit RAM assumption
        # No routed image or physical PLL/DAC behavior is qualified by this job.
        run: |
          export PYTHONPATH="$RUNNER_TEMP/fastino-dependencies/migen:$RUNNER_TEMP/fastino-dependencies/misoc"
          export ICE40_CELLS_SIM="$RUNNER_TEMP/fastino-dependencies/cells_sim.v"
          bash offline_tests/run_checks.sh --output "$RUNNER_TEMP/fastino-checks" --assume-zero-ram
